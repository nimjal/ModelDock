# Stage a release to npm on a version tag. Approving it is a separate,
# deliberate act by a person — see the last step.
#
# There is no npm token in this repository and there is not meant to be one.
# Authentication is npm trusted publishing: the runner mints a short-lived
# GitHub OIDC token, npm exchanges it for a credential good for this one
# operation, and nothing long-lived exists to leak, rotate or forget. The npm
# side of that handshake is configured on the package itself, at
# https://www.npmjs.com/package/modeldock/access, and every field there is
# matched exactly — repository, workflow filename, environment.
#
# That configuration deliberately grants `npm stage publish` alone. Automation
# that can publish is automation that can be made to publish, and the whole
# point of removing the token was to stop anything in CI from being able to
# ship on its own. What remains here is a build, not a release.
#
# When the handshake does not happen, npm does not say so. It reports
# ENEEDAUTH or a 404 on a package that plainly exists, both of which point at
# the wrong subsystem entirely (npm/cli#9088). The diagnostics step below
# exists so that the next person to hit this can tell in one glance which half
# is at fault: this workflow, or the configuration on npmjs.com.

name: Release

on:
  push:
    tags: ['v*']
  # Publishing is the one path here that cannot be rehearsed — the OIDC
  # exchange only happens during a real publish, so a dry run proves nothing
  # about it. Without a manual trigger, every attempt to fix this workflow
  # costs a tag deletion and a re-push, which is a bad way to iterate and
  # leaves a confusing tag history behind. A dispatch run publishes whatever
  # version package.json names on the ref you pick.
  workflow_dispatch:

# `id-token: write` is what lets the runner mint the OIDC token; without it npm
# has nothing to exchange and goes looking for a token that does not exist.
# `contents: read` is all the rest of the job does — it never writes back.
permissions:
  id-token: write
  contents: read

# Two publishes of the same version cannot both win, and a re-run racing the
# original is a confusing way to find that out. Queue instead of cancelling:
# a publish that is already talking to the registry should be left alone.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must line up with the trusted publisher configured for `modeldock` on
    # npmjs.com: same repository, same workflow filename (release.yml), and
    # either this same environment name or none set there at all.
    #
    # Note the interaction with this environment's own protection rules: if
    # its deployment targets are restricted to `v*` tags, a workflow_dispatch
    # run from a branch is refused before the job starts. Allow `main` too if
    # you want the manual trigger to be usable.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes. Leaving the token behind in .git/config
          # would hand it to every dependency lifecycle script that runs
          # afterwards, for no benefit.
          persist-credentials: false

      # Deliberately no `registry-url:` here. Setting it makes setup-node write
      #
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #
      # into ~/.npmrc, and with no NODE_AUTH_TOKEN set — which is the entire
      # point of trusted publishing — that expands to an empty token. npm reads
      # the line as "auth is already configured", skips the OIDC exchange
      # altogether and PUTs unauthenticated, which the registry answers with a
      # baffling E404 on a package that plainly exists. Left out, npm defaults
      # to registry.npmjs.org anyway and takes the OIDC path.
      # https://github.com/npm/documentation/issues/1960
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Cheap, and the difference between a five-minute fix and an afternoon.
      # If npm clears the floor and both OIDC variables are present, then this
      # workflow has done its part and any remaining failure is the trusted
      # publisher configuration on npmjs.com — wrong repository, wrong workflow
      # filename, wrong environment, or never saved. Presence only: the request
      # token is a credential and is never printed.
      #
      # Two separate things set this floor and the higher one wins. The OIDC
      # exchange needs 11.5.1; `npm stage` did not exist until 11.15.0, so that
      # is the number. A runner below it gets all the way to the last step and
      # fails with `Unknown command: "stage"`, which says nothing about
      # versions and sends the reader into the workflow file looking for a typo
      # — worth one honest line up here instead. Above the floor the same step
      # still earns its keep: it is what distinguishes a workflow problem from
      # an ENEEDAUTH caused by the npmjs.com configuration.
      #
      # The floor is asserted rather than installed. `npm install -g npm@latest`
      # is the obvious way to guarantee it and the wrong one: latest is now
      # npm 12, which stopped running dependency install scripts by default, so
      # better-sqlite3 never gets a native binding and the whole suite dies on
      # the first query. Upgrading the toolchain to satisfy a version floor
      # changes far more than the version.
      - name: Trusted publishing preconditions
        run: |
          floor=11.15.0
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n1)" != "$floor" ]; then
            echo "::error::npm $have is below the $floor that staged publishing needs"
            exit 1
          fi

          # `yes`/`no` only, via :+ — which expands to the replacement or to
          # nothing at all. The token itself must never reach a public log, so
          # no expansion here is allowed to fall back to a variable's value.
          url="${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          tok="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          workflow="${GITHUB_WORKFLOW_REF##*/.github/workflows/}"

          echo "node             $(node --version)"
          echo "npm              $have   (floor $floor, and below npm 12 — see the note above)"
          echo "OIDC url set     ${url:-no  <-- id-token: write is not in effect}"
          echo "OIDC token set   ${tok:-no  <-- id-token: write is not in effect}"
          echo
          echo "These three must match the trusted publisher on npmjs.com exactly:"
          echo "  repository     ${GITHUB_REPOSITORY}"
          echo "  workflow file  ${workflow%%@*}"
          echo "  environment    release"

      # A tag that disagrees with package.json means one of the two is wrong,
      # and the expensive way to discover that is a published 0.1.1 sitting
      # under a v0.2.0 tag — immutable, and confusing for everyone who reads it
      # later. Skipped on a manual run, where the ref is a branch and the
      # version in package.json is the whole answer.
      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "staging $pkg"

      - run: npm ci
      - run: npm test

      # Staged, not published. This job cannot put a live package on the
      # registry: the trusted publisher for `modeldock` grants
      # `npm stage publish` and not `npm publish`, so the most this workflow
      # can do — with a stolen tag, a compromised branch, or a hostile
      # dependency running during the build — is queue a tarball that a human
      # then declines. Going live needs `npm stage approve` and a second
      # factor, which lives on a phone rather than in this repository.
      #
      # `publishConfig.access` in package.json covers --access. `--provenance`
      # is in principle redundant — the documentation says an OIDC publish
      # attaches an attestation on its own — but it also states the intent to
      # use OIDC, and asking explicitly costs nothing. `prepack` builds dist/,
      # which is gitignored and therefore has to be built here; if it ever
      # failed to, the staged tarball is inspectable before approval rather
      # than a bad release someone has to unpublish.
      - run: npm stage publish --provenance

      # A release now needs a second, manual step, and it will be weeks
      # between releases. Put the instructions on the run page itself rather
      # than making someone go and look them up.
      - name: How to approve this release
        run: |
          {
            echo "### Staged — nothing is live yet"
            echo
            echo '```'
            echo "npm stage list modeldock      # find the stage id"
            echo "npm stage view <stage-id>     # inspect exactly what CI built"
            echo "npm stage approve <stage-id>  # 2FA, then it goes live"
            echo "npm stage reject <stage-id>   # 2FA, discards it permanently"
            echo '```'
            echo
            echo "Or the **Staged Packages** tab on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
