name: Bug report
description: Something behaves differently from how it is documented.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Please do not report a security vulnerability here. Use the Security tab,
        or see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the app did in response.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a thread on …
        2. Switch the connection to …
        3. …
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `modeldock doctor`
      description: >
        This is usually the single most useful thing in a report. It says which
        connections and coding engines are actually usable in your environment,
        and which skill files could not be read. It contains the *names* of
        environment variables, never their values — but read it before pasting.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ModelDock version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: "`node --version`"
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, or the shape of the data involved.
